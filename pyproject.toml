[build-system]
requires = ["setuptools>=60", "wheel", "numpy>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-design"
version = "2.1.0"
description = "Design points for random experiments"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE.txt"}
authors = [
    {name = "Ilias Bilionis", email = "ibilion@purdue.edu"},
]
maintainers = [
    {name = "James Kermode"},
]
keywords = [
    "design",
    "random experiment",
    "latin hypercube",
    "sparse grid",
    "computer experiments",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Fortran",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26.0",
]

[project.urls]
Homepage = "https://github.com/jameskermode/py-design"
Repository = "https://github.com/jameskermode/py-design"

[tool.setuptools]
packages = ["design"]
